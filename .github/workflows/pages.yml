# Publish the project page (share/) to GitHub Pages on every push to main that touches it.
# share/index.html and share/fig/ are generated by analysis/share_page.py and committed;
# this workflow only uploads them, it does not rebuild anything.
name: Deploy project page

on:
  push:
    branches: [main]
    paths: ["share/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: share
      - id: deployment
        uses: actions/deploy-pages@v4
